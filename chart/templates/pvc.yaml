apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "devbox.fullname" . }}-home
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
  annotations:
    # Keep the dev home (repos, dotfiles) even if the release is uninstalled.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.home.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "devbox.fullname" . }}-ts-state
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.tailscaleState.size }}
