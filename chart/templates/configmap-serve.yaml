apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devbox.fullname" . }}-ts-serve
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
data:
  # tailscale serve: forward tailnet TCP 22 to the in-pod sshd (locally-originated dial,
  # which avoids the Cilium ClusterIP / containerd issues of operator L4 Service-expose).
  serve-config.json: |
    {"TCP":{"22":{"TCPForward":"127.0.0.1:{{ .Values.ssh.port }}"}}}
