apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devbox.fullname" . }}
  labels:
    {{- include "devbox.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "devbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "devbox.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seed the persistent /nix PVC from the image's baked store. flox and nix-daemon
        # are symlinked/linked into /nix/store, so an empty mount would break them; and
        # because those paths are pinned by hash, a store left over from an older image
        # would break the new flox. Keying the seed on `readlink /usr/bin/flox` re-seeds
        # automatically whenever the image's flox closure changes, and is a cheap no-op
        # otherwise.
        - name: seed-nix
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -eu
              ref="$(readlink -f /usr/bin/flox)"
              if [ "$(cat /mnt/nix/.image-store-ref 2>/dev/null || true)" = "$ref" ]; then
                echo "seed-nix: /nix store up to date ($ref)"
                exit 0
              fi
              echo "seed-nix: seeding /nix store from image ($ref)"
              find /mnt/nix -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              cp -a /nix/. /mnt/nix/
              printf '%s\n' "$ref" > /mnt/nix/.image-store-ref
          volumeMounts:
            - name: nix
              mountPath: /mnt/nix
      containers:
        - name: workspace
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DEV_USER
              value: {{ .Values.dev.user | quote }}
            - name: PUBLIC_KEY
              value: {{ .Values.dev.publicKey | quote }}
          ports:
            - containerPort: {{ .Values.ssh.port }}
              name: ssh
          volumeMounts:
            - name: home
              mountPath: /home/{{ .Values.dev.user }}
            - name: nix
              mountPath: /nix
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: tailscale
          image: {{ .Values.tailscale.image }}
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tailscale.authKey.existingSecret }}
                  key: {{ .Values.tailscale.authKey.key }}
            - name: TS_HOSTNAME
              value: {{ .Values.tailscale.hostname | quote }}
            - name: TS_USERSPACE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags={{ .Values.tailscale.tags }}"
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_SERVE_CONFIG
              value: /config/serve-config.json
          volumeMounts:
            - name: serve
              mountPath: /config
            - name: ts-state
              mountPath: /var/lib/tailscale
          resources:
            {{- toYaml .Values.tailscale.resources | nindent 12 }}
      volumes:
        - name: serve
          configMap:
            name: {{ include "devbox.fullname" . }}-ts-serve
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "devbox.fullname" . }}-home
        - name: nix
          persistentVolumeClaim:
            claimName: {{ include "devbox.fullname" . }}-nix
        - name: ts-state
          persistentVolumeClaim:
            claimName: {{ include "devbox.fullname" . }}-ts-state
