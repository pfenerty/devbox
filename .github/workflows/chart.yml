name: chart

# Packages the Helm chart and pushes it to GHCR as an OCI artifact:
#   oci://ghcr.io/<owner>/charts/devbox:<chart-version>
# (Published under charts/ so it doesn't collide with the container image
# ghcr.io/<owner>/devbox.) Bump version in chart/Chart.yaml to release a new one.
#
# Fetches the current image digest from GHCR and injects it into values.yaml before
# packaging so the published chart pins an immutable reference (not committed to the repo).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject current image digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "ghcr.io/${{ github.repository_owner }}/devbox:latest" \
            | awk '/^Digest:/{print $2}')
          yq -i ".image.digest = \"$DIGEST\"" chart/values.yaml

      - name: Lint
        run: helm lint chart --set dev.publicKey="ssh-ed25519 AAAA ci@lint"

      - name: Package and push
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"
          helm package chart --destination /tmp/chart
          helm push /tmp/chart/devbox-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
